name: CI

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "0 2 * * *"

jobs:
  lint-and-unit-tests:
    name: Lint and Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements.dev.txt

      - name: Ruff lint
        run: ruff check backend frontend tests

      - name: Pytest
        run: pytest --cov=backend --cov-report=term-missing

  nightly-integration-placeholder:
    name: Nightly Integration Placeholder
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Explain next step
        run: |
          echo "Add heavy integration tests here (DB, scraping, E2E)."
          echo "This job is only executed on nightly schedule."
