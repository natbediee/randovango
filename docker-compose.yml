services:
  mongo:
    container_name: mongo_randovango
    image: mongo
    restart: always
    ports:
      - 27017:27017
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD}
    volumes:
      - ./storage/mongodb:/data/db
    networks:
      - randovango
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
  db_randovango:
    image: mysql
    container_name: db_randovango
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PSWD}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PSWD}
    ports:
      - "3306:3306"
    volumes:
      - ./storage/mysql:/var/lib/mysql
    restart: always
    networks:
      - randovango
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PSWD}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
  
  adminer:
    image: adminer
    container_name: adminer_randovango
    restart: always
    ports:
      - ${ADMINER_PORT}:8080
    networks:
      - randovango

  backend:
    container_name: fastapi_backend
    build:
      context: .
      dockerfile: Dockerfile.backend
    volumes:
      - ./backend:/usr/src/app
      - ./.env:/usr/src/.env
      - ./data:/usr/src/data
      - ./storage:/usr/src/storage
      - ./logs:/usr/src/logs
    ports:
      - "8000:8000"
    networks:
      - randovango
    restart: always
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/docs"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    depends_on:
      mongo:
        condition: service_healthy
      db_randovango:
        condition: service_healthy

  frontend:
    container_name: flask_frontend
    build:
      context: .
      dockerfile: Dockerfile.frontend
    volumes:
      - ./frontend:/usr/src/app
      - ./.env:/usr/src/app/.env
    ports:
      - "80:5000"
    networks:
      - randovango
    restart: always
    depends_on:
      backend:
        condition: service_healthy

networks:
  randovango:
    driver: bridge