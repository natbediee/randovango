# Reverse proxy RandoVanGo : un SEUL point d'entrée public.
#   /api/...  -> backend FastAPI (jamais exposé directement à l'extérieur)
#   le reste  -> frontend Flask
# C'est ce service qu'on tunnelise (ngrok http 80). Le navigateur du visiteur ne
# voit qu'une seule origine, donc les appels API en chemin relatif (/api/...)
# fonctionnent sans CORS et le backend reste caché.
server {
    listen 80;
    server_name _;

    # Autorise les imports GPX un peu volumineux (défaut nginx = 1 Mo).
    client_max_body_size 20m;

    # API : tout /api/... part vers le backend, en conservant le préfixe /api
    # (les routes FastAPI sont déjà préfixées par /api).
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Tout le reste (pages, /static, ...) part vers le front Flask.
    location / {
        proxy_pass http://frontend:5000;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
