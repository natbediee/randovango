<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}RandoVanGo{% endblock %}</title>

    <link rel="icon" type="image/png" href="{{ url_for('static', filename='images/logo/favicon-teal.png') }}">

    <!-- Google Fonts : Archivo (titres) + Public Sans (corps) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;800&family=Public+Sans:wght@400;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="{{ url_for('static', filename='v2/css/app.css') }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />

    {% block head_extra %}{% endblock %}
</head>

<body>
    <div class="page">
        {% block header %}
            {% include 'v2/partials/header.html' %}
        {% endblock %}

        <main class="page-main {% block main_class %}{% endblock %}">
            {% block page_content %}{% endblock %}
        </main>

        {% block footer %}
            {% include 'v2/partials/footer.html' %}
        {% endblock %}
    </div>

    <!-- Positionnement des tuiles en left/top plutôt qu'en transform 3D : supprime les
         fins liserés blancs entre tuiles sur les écrans à mise à l'échelle fractionnaire.
         Doit être défini AVANT le chargement de leaflet.js. -->
    <script>window.L_DISABLE_3D = true;</script>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
        integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
        crossorigin=""></script>

    <!-- URLs Flask exposées au JS statique (fichiers hors du moteur de templates Jinja) -->
    <script>
        window.APP_URLS = {
            duration: "{{ url_for('duration') }}",
            step1: "{{ url_for('step1') }}",
            step2: "{{ url_for('step2') }}",
            step3: "{{ url_for('step3') }}",
            step4: "{{ url_for('step4') }}",
            results: "{{ url_for('results') }}",
            howItWorks: "{{ url_for('how_it_works') }}",
            chat: "{{ url_for('chat') }}",
            contributorLogin: "{{ url_for('contributor_login') }}",
            contributor: "{{ url_for('contributor_dashboard') }}",
            contributorAddHike: "{{ url_for('contributor_add_hike') }}",
            unlockVany: "{{ url_for('unlock_vany') }}"
        };
        // URL de l'API FastAPI, jointe directement par le navigateur (plus de relais Flask)
        window.API_BASE = "{{ public_api_base_url }}";
    </script>

    <script src="{{ url_for('static', filename='v2/js/common.js') }}"></script>

    {% block scripts %}{% endblock %}
</body>

</html>
